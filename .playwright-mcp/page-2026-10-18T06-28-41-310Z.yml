            - paragraph [ref=f3e207]: Run any public Docker image on blitz.cloud, from Docker Hub, ghcr.io or Quay, with HTTPS, environment variables and persistent storage built in.
          - link [ref=f3e208] [cursor=pointer]:
            - /url: /docs/databases/
            - heading "Managed databases on blitz.cloud - PostgreSQL, MariaDB, Redis" [level=3] [ref=f3e209]
            - paragraph [ref=f3e210]: Create managed PostgreSQL 17, MariaDB 11.4 or Redis (Valkey 8) databases on blitz.cloud, connected to your app automatically and backed up every night.
      - generic [ref=f3e211]:
        - heading "Put your first app online today." [level=2] [ref=f3e212]
        - paragraph [ref=f3e213]: Free plan, no credit card, no waiting list.
        - link "Create a free account" [ref=f3e214] [cursor=pointer]:
