name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      TARGET_URL_ALLOWLIST: 127.0.0.1
      TARGET_URL_ALLOW_PRIVATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check keepalive.mjs
          node --check public/app.js
          node --check test/fake-blitz.mjs
          node --check test/admin-smoke.mjs
          node --check test/hardening.mjs
          node --check deploy/backup-crypto.mjs

      - name: Smoke tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
