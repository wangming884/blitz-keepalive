name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    env:
      TARGET_URL_ALLOWLIST: 127.0.0.1
      TARGET_URL_ALLOW_PRIVATE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check keepalive.mjs
          node --check public/app.js
          node --check test/fake-blitz.mjs
          node --check test/admin-smoke.mjs
          node --check test/hardening.mjs
          node --check deploy/backup-crypto.mjs
          bash -n deploy/backup.sh
          bash -n deploy/server/restore-drill.sh

      - name: Smoke tests
        run: npm test

      - name: Validate production Compose
        run: docker compose --env-file deploy/server/.env.example -f compose.server.yaml config --quiet

      - name: Validate production Nginx configuration
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=keepalive.example.com" \
            -keyout "$tmpdir/privkey.pem" \
            -out "$tmpdir/fullchain.pem" >/dev/null 2>&1
          sed \
            -e 's#/etc/letsencrypt/live/keepalive.example.com/fullchain.pem#/certs/fullchain.pem#' \
            -e 's#/etc/letsencrypt/live/keepalive.example.com/privkey.pem#/certs/privkey.pem#' \
            deploy/server/nginx.conf.example > "$tmpdir/keepalive.conf"
          docker run --rm \
            -v "$tmpdir/keepalive.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$tmpdir:/certs:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 nginx -t

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
