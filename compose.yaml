# Single management console for local deployment and smoke testing.
#
# Start with: docker compose up -d
# Open:       http://localhost:8090/admin
#
# Targets are intentionally not configured here. Open /admin and add the URL
# that should be kept awake. For a real deployment, configure the required
# secrets and persistent paths in the Blitz dashboard.
services:
  keepalive:
    build: .
    init: true
    mem_limit: 1g
    pids_limit: 512
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      INTERVAL_MIN: 20
      JITTER_MIN: 2
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Asia/Shanghai}
      MAX_CONCURRENT: 1
      MAX_KEEP_OPEN_SESSIONS: ${MAX_KEEP_OPEN_SESSIONS:-1}
      PORT: 8090
      BIND_HOST: 0.0.0.0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: /app/data/admin-auth.json
      MANAGED_TARGETS_FILE: /app/data/managed-targets.json
      RUNTIME_STATE_FILE: /app/data/runtime-state.json
      STATS_FILE: /app/data/stats.json
      TARGET_SECRET_KEY_FILE: /app/data/target-secrets.key
      TARGET_URL_STRICT_SUBRESOURCES: "false"
      PUBLIC_STATUS: ${PUBLIC_STATUS:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_MIN_INTERVAL_SEC: ${WEBHOOK_MIN_INTERVAL_SEC:-900}
      WEBHOOK_FAILURE_THRESHOLD: ${WEBHOOK_FAILURE_THRESHOLD:-3}
      BLOCK_RESOURCES: ${BLOCK_RESOURCES:-}
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
